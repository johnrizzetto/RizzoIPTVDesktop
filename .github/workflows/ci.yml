name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches:
      - main
      - claude/romantic-leakey-57e175-work
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-cache: true

      - name: Run lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-cache: true

      - name: Assemble release
        run: ./gradlew :app:assembleRelease
        env:
          # Signing only runs if local.properties has RELEASE_KEYSTORE_PATH set.
          # On CI without a keystore, this will build an unsigned release.
          # To sign, add RELEASE_KEYSTORE_PATH, RELEASE_KEYSTORE_PASSWORD,
          # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD to local.properties in CI secrets.

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
